# This is a basic Flutter pubspec.yaml file for the Klinik application.
name: Klinik
description: Application de consultation médicale, scan médical et délivrance d'ordonnances médicales (des patients) pour les professionnels de santé.
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ">=3.9.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  flutter_localizations:
    sdk: flutter

  intl: ^0.20.2

  # État global
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # Navigation
  go_router: ^14.0.0

  # Firebase
  firebase_core: ^3.0.0
  firebase_auth: ^5.0.0
  cloud_firestore: ^5.0.0
  firebase_storage: ^12.0.0
  firebase_messaging: ^15.0.0
  firebase_remote_config: ^5.0.0

  # Offline & Stockage local
  hive_flutter: ^1.1.0
  connectivity_plus: ^6.0.0
  flutter_secure_storage: ^9.0.0

  # UI & Design
  google_fonts: ^6.2.1
  flutter_svg: ^2.0.10  # Rendu des logos vectoriels (KMark splash/auth)

  # Médias
  image_picker: ^1.1.0
  # camera: ^0.11.0  # V1.1 — Module vision reporté
  # video_compress: ^3.1.2  # V1.1

  # Lecture des sons embarqués
  audioplayers: ^6.1.0

  # PDF (V1.1 — reporté pour MVP)
  # pdf: ^3.11.0  # Problème Gradle
  # printing: ^5.13.0  # Problème Gradle

  # Paiement
  flutter_stripe: ^10.0.0

  # Publicités (V1.1 — reporté pour MVP)
  # google_mobile_ads: ^6.0.0  # Problème Gradle incompatibilité

  # Icônes — fork maintenu compatible Flutter 3.x (RÈGLE 7 : lucide uniquement)
  lucide_icons_flutter: ^3.0.0

  # Utilitaires
  path_provider: ^2.1.3
  share_plus: ^10.0.0
  file_picker: ^8.0.0
  flutter_image_compress: ^2.3.0
  uuid: ^4.4.0
  http: ^1.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0
  build_runner: ^2.4.9
  riverpod_generator: ^2.4.0

flutter:
  uses-material-design: true

  assets:
    - assets/logos/
    - assets/images/
    - assets/sounds/